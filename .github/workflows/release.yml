name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # A manual gate in front of an irreversible action.
    #
    # `npm publish` cannot be taken back: unpublishing is restricted after 72
    # hours and a version number can never be reused. A tag push is a cheap
    # gesture by comparison — `git push --tags` sends every local tag — so the
    # confirmation lives here instead, after the gates below have run.
    #
    # That ordering is the point. What gets approved is not "I intend to cut a
    # release" but "this build passed everything and may go to the registry".
    #
    # Set up once: Settings -> Environments -> New environment named `npm`,
    # with Required reviewers. Without it the job runs unattended, which is
    # the behaviour this comment exists to prevent.
    environment: npm
    permissions:
      # Writing the GitHub Release once the publish has succeeded.
      contents: write
      # Required for npm provenance: the registry records which workflow, from
      # which commit, produced the tarball, and anyone can verify it.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      # `npm stage` needs 11.15.0 or newer, and Node 24 ships 11.4.x.
      - run: npm i -g npm@^11.15.0

      - run: npm ci

      # The tag is the only thing that triggers this, so it had better match
      # what is about to be published. A mismatch here is a wrong version on
      # the registry, which cannot be taken back.
      - name: tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json $pkg"
            exit 1
          fi

      # Publishing something that does not pass its own gates is worse than
      # not publishing, so they all run again here rather than trusting that
      # CI ran on the commit.
      - run: npx biome ci .
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx vitest run

      # Staged, not published.
      #
      # The tarball goes to npm's staging queue rather than the registry, and
      # a human has to approve it there with 2FA before anyone can install it.
      # Staging itself needs no 2FA, which is what lets CI do this part.
      #
      # No NODE_AUTH_TOKEN: authentication is OIDC. npm verifies with GitHub
      # that this request comes from this repository's release.yml running in
      # the `npm` environment, so there is no long-lived credential anywhere to
      # leak. Provenance is the default under trusted publishing, so the flag
      # is gone too.
      - run: npm stage publish --access public

      # A draft, because the package is staged and not yet installable.
      #
      # Publishing the Release here would advertise a version nobody can get,
      # and CI cannot know when the npm approval happens. So the notes are
      # prepared and left as a draft: whoever approves the stage on npm
      # publishes this at the same moment.
      - name: Draft the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
          printf '%s\n\n---\n\n```sh\nnpm i iplook@%s\n```\n' \
            "$notes" "${GITHUB_REF_NAME#v}" > /tmp/notes.md
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/notes.md \
            --verify-tag
